# memmon configuration
#
# Read by memmon itself at startup - by the memmon.service daemon and by
# interactive runs alike. Per-user overrides go in
# ~/.config/memmon/memmon.conf; MEMMON_* environment variables override
# both, and command-line options override everything.
#
# After editing, apply it to the running daemon with:
#
#   sudo systemctl reload memmon
#
# This file is preserved across package upgrades.

# How often the daemon samples memory and appends a snapshot to today's
# log file. Plain seconds or a suffix: s, m, h, d.
MEMMON_INTERVAL=5m

# Align samples to wall-clock multiples of the interval (:00, :05, ... for
# 5m) instead of "N seconds after startup". yes/no.
#MEMMON_ALIGN=yes

# Directory holding the daily log files. Interactive runs by users who
# can't write here fall back to ~/.local/share/memmon.
# NOTE: for the systemd service, a directory other than /var/log/memmon
# must be writable by the "memmon" user and allowed via
# `systemctl edit memmon` -> [Service] ReadWritePaths=/that/dir
MEMMON_LOG_DIR=/var/log/memmon

# Log file format: text (YYYY-MM-DD.log, human readable), json
# (YYYY-MM-DD.jsonl, one JSON object per line) or csv (YYYY-MM-DD.csv).
#MEMMON_LOG_FORMAT=text

# Log files older than this many days are deleted automatically.
# Set to 0 to keep logs forever (auto-delete disabled).
MEMMON_LOG_RETENTION_DAYS=30

# gzip previous days' log files. yes/no.
#MEMMON_LOG_COMPRESS=yes

# Number of largest processes (by resident memory) to show and log.
# 0 hides the section.
#MEMMON_TOP_PROCESSES=5

# Memory-used thresholds (percent) for the warning/critical levels. They
# color the bars and, in daemon mode, a level change is logged to the
# journal and runs MEMMON_ALERT_CMD.
#MEMMON_WARN_PERCENT=60
#MEMMON_CRIT_PERCENT=85

# Shell command run (via /bin/sh -c) by the daemon when the alert level
# changes. It gets MEMMON_ALERT_LEVEL (ok/warning/critical),
# MEMMON_ALERT_PREVIOUS, MEMMON_MEM_PCT, MEMMON_MEM_USED_KB,
# MEMMON_MEM_TOTAL_KB, MEMMON_SWAP_PCT, MEMMON_PSI_SOME_AVG10 and
# MEMMON_HOST in its environment. Example:
#MEMMON_ALERT_CMD=logger -p user.warning "memmon: $MEMMON_HOST memory $MEMMON_ALERT_LEVEL ($MEMMON_MEM_PCT%)"

# cgroup v2 group to report on, relative to /sys/fs/cgroup. By default
# memmon shows the nearest memory-limited ancestor of its own cgroup
# (e.g. the container it runs in), or nothing if there is no limit.
#MEMMON_CGROUP=/system.slice/myapp.service

# Units for sizes: auto, k (KiB), m (MiB) or g (GiB).
#MEMMON_UNITS=auto
