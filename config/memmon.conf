# memmon daemon configuration
#
# Sourced by the memmon.service systemd unit (EnvironmentFile=). Edit any
# value below, then apply it with:
#
#   sudo systemctl restart memmon
#
# This file is preserved across package upgrades.

# How often the daemon samples /proc/meminfo and appends a snapshot to
# today's log file. Accepts a plain number of seconds or a suffix:
# s (seconds), m (minutes), h (hours), d (days).
MEMMON_INTERVAL=5m

# Directory holding the daily log files (YYYY-MM-DD.log).
MEMMON_LOG_DIR=/var/log/memmon

# Log files older than this many days are deleted automatically.
# Set to 0 to keep logs forever (auto-delete disabled).
MEMMON_LOG_RETENTION_DAYS=30
